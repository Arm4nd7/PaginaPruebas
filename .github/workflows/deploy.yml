name: Deploy PaginaPruebas

on:
  push:
    branches:
      - master_armando

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Unit Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Run test_start_unittestPrueba.py
        run: |
          cd tests
          python test_start_unittestPrueba.py

      - name: Run test_start_unittestPrueba2.py
        run: |
          cd tests
          python test_start_unittestPrueba2.py

      - name: Run test_start_unittestPrueba3.py
        run: |
          cd tests
          python test_start_unittestPrueba3.py

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: PaginaPruebas

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
